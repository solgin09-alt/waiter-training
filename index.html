<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fish Point — обучение официантов</title>

  <style>
    .hero {
  position: relative;
  min-height: 78vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;

  background:
    radial-gradient(
      circle at 30% 20%,
      rgba(255,255,255,0.08),
      transparent 35%
    ),
    linear-gradient(
      160deg,
      #0c1b1d 0%,
      #102f32 45%,
      #061012 100%
    );
}

.hero::before {
  content: "";
  position: absolute;
  inset: -20%;

  background:
    radial-gradient(
      circle,
      rgba(72, 160, 168, 0.18) 0%,
      transparent 55%
    );

  animation: heroGlow 7s ease-in-out infinite alternate;
}

.hero-overlay {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0.05),
      rgba(0,0,0,0.38)
    );
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  color: white;
  padding: 24px;
}

.hero-logo {
  font-size: clamp(54px, 14vw, 100px);
  font-weight: 900;
  letter-spacing: -3px;
  line-height: 0.95;

  opacity: 0;
  transform: translateY(20px) scale(0.96);

  animation:
    heroLogoIn 1.1s ease forwards;
}

.hero-subtitle {
  margin-top: 18px;
  font-size: 16px;
  opacity: 0;

  animation:
    heroTextIn 1s ease .45s forwards;
}

.hero-scroll {
  margin-top: 46px;
  font-size: 28px;
  opacity: .7;

  animation:
    heroBounce 1.8s ease-in-out infinite;
}

@keyframes heroLogoIn {
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes heroTextIn {
  to {
    opacity: .8;
  }
}

@keyframes heroGlow {
  from {
    transform: scale(1) translate(-2%, -1%);
  }

  to {
    transform: scale(1.15) translate(3%, 2%);
  }
}

@keyframes heroBounce {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(8px);
  }
}
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f6f6;
      color: #111;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: white;
      padding: 14px 16px;
      border-bottom: 1px solid #ddd;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .search {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
    }

    .container {
      padding: 16px;
    }

    .section {
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .cards {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 6px;
    }

    .card {
      min-width: 82vw;
      max-width: 340px;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      scroll-snap-align: start;
      box-shadow: 0 3px 14px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #ddd;
    }

    .card-content {
      padding: 14px;
    }

    .dish-name {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .description {
      font-size: 15px;
      line-height: 1.4;
      color: #333;
      margin-bottom: 8px;
    }

    .ingredients,
    .waiter-note {
      font-size: 14px;
      line-height: 1.4;
      margin-top: 8px;
    }

    .label {
      font-weight: 700;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <section class="hero">
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div class="hero-logo">Fish Point</div>
    <div class="hero-subtitle">
      Меню и обучение официантов
    </div>

    <div class="hero-scroll">
      ↓
    </div>
  </div>
</section>
  <header class="header">
    <div class="logo">Fish Point</div>
    <input
      id="searchInput"
      class="search"
      type="text"
      placeholder="Поиск блюда..."
    />
  </header>

  <main class="container" id="menuContainer">
  <div>Загрузка меню...</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://amvdqxpndhlbufubiosk.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Qx1-_jeg3aSK0cko4fQPoA_BirwNKz4";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const menuContainer = document.getElementById("menuContainer");
  const searchInput = document.getElementById("searchInput");

  let allSections = [];
  let allDishes = [];

  async function loadMenu() {
    const { data: sections, error: sectionsError } =
      await supabaseClient
        .from("sections")
        .select("*")
        .order("sort_order", { ascending: true });

    const { data: dishes, error: dishesError } =
      await supabaseClient
        .from("dishes")
        .select("*")
        .eq("is_visible", true)
        .order("sort_order", { ascending: true });

    if (sectionsError || dishesError) {
      console.error(sectionsError || dishesError);
      menuContainer.innerHTML = "Ошибка загрузки меню";
      return;
    }

    allSections = sections || [];
    allDishes = dishes || [];

    renderMenu();
  }

  function renderMenu(searchValue = "") {
    const query = searchValue.toLowerCase().trim();

    menuContainer.innerHTML = "";

    allSections.forEach(section => {
      const dishes = allDishes.filter(dish =>
        dish.section_id === section.id &&
        (!query || dish.name.toLowerCase().includes(query))
      );

      if (!dishes.length) return;

      const sectionElement = document.createElement("section");
      sectionElement.className = "section";

      sectionElement.innerHTML = `
        <div class="section-title">${section.name}</div>
        <div class="cards"></div>
      `;

      const cardsContainer =
        sectionElement.querySelector(".cards");

      dishes.forEach(dish => {
        const card = document.createElement("article");
        card.className = "card";

        const image =
          dish.photo_url ||
          "https://placehold.co/600x400?text=Fish+Point";

        card.innerHTML = `
          <img src="${image}" alt="${dish.name}">

          <div class="card-content">

            <div class="dish-name">
              ${dish.name}
            </div>

            <div class="description">
              ${dish.short_description || ""}
            </div>

            <div class="ingredients">
              <span class="label">Состав:</span>
              ${dish.ingredients || ""}
            </div>

            <div class="waiter-note">
              <span class="label">Официанту:</span>
              ${dish.waiter_note || ""}
            </div>

          </div>
        `;

        cardsContainer.appendChild(card);
      });

      menuContainer.appendChild(sectionElement);
    });

    if (!menuContainer.children.length) {
      menuContainer.innerHTML = "Ничего не найдено";
    }
  }

  searchInput.addEventListener("input", function () {
    renderMenu(this.value);
  });

  loadMenu();
</script>

</body>
</html>
