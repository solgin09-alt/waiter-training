<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fish Point — обучение официантов</title>

  <style>
    .hero {
  position: relative;
  min-height: 78vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
      will-change: opacity, transform;

  background:
    radial-gradient(
      circle at 30% 20%,
      rgba(255,255,255,0.08),
      transparent 35%
    ),
    linear-gradient(
      160deg,
      #0c1b1d 0%,
      #102f32 45%,
      #061012 100%
    );
}

.hero::before {
  content: "";
  position: absolute;
  inset: -20%;

  background:
    radial-gradient(
      circle,
      rgba(72, 160, 168, 0.18) 0%,
      transparent 55%
    );

  animation: heroGlow 7s ease-in-out infinite alternate;
}

.hero-overlay {
  position: absolute;
  inset: 0;

  background:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0.05),
      rgba(0,0,0,0.38)
    );
}

.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  color: white;
  padding: 24px;
  transform-origin: center center;
will-change: transform, opacity, filter;
transition: transform 0.08s linear,
            opacity 0.08s linear,
            filter 0.08s linear;
}

.hero-logo {
  display: flex;
  justify-content: center;
  align-items: center;

  opacity: 0;
  transform: translateY(20px) scale(0.94);

  animation: heroLogoIn 1.2s ease forwards;
}

.hero-logo img {
  width: min(78vw, 520px);
  max-height: 46vh;
  object-fit: contain;
.hero-logo {
  position: relative;
}

.hero-logo::before {
  content: "";
  position: absolute;

  width: 75vw;
  height: 75vw;
  max-width: 500px;
  max-height: 500px;

  background: radial-gradient(
    circle,
    rgba(180, 120, 55, 0.20) 0%,
    rgba(120, 80, 35, 0.08) 40%,
    transparent 70%
  );

  filter: blur(18px);
  z-index: -1;
  pointer-events: none;
}
  filter:
    drop-shadow(0 10px 30px rgba(0,0,0,0.35));
}

  opacity: 0;
  transform: translateY(20px) scale(0.96);

  animation:
    heroLogoIn 1.1s ease forwards;
}

.hero-subtitle {
  margin-top: 18px;
  font-size: 16px;
  opacity: 0;

  animation:
    heroTextIn 1s ease .45s forwards;
}

.hero-scroll {
  margin-top: 46px;
  font-size: 28px;
  opacity: .7;

  animation:
    heroBounce 1.8s ease-in-out infinite;
}

@keyframes heroLogoIn {
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes heroTextIn {
  to {
    opacity: .8;
  }
}

@keyframes heroGlow {
  from {
    transform: scale(1) translate(-2%, -1%);
  }

  to {
    transform: scale(1.15) translate(3%, 2%);
  }
}

@keyframes heroBounce {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(8px);
  }
}
    * {
      box-sizing: border-box;
    }

    body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #f3f1ec;

  background:
    radial-gradient(
      circle at 20% 10%,
      rgba(44, 104, 105, 0.20),
      transparent 32%
    ),
    radial-gradient(
      circle at 80% 35%,
      rgba(18, 74, 80, 0.16),
      transparent 38%
    ),
    linear-gradient(
      180deg,
      #0a1517 0%,
      #0d1a1b 35%,
      #16120f 72%,
      #0b0b0b 100%
    );

  background-attachment: fixed;
}

    .header {
  position: sticky;
  top: 0;
  z-index: 20;

  padding: 12px 14px;

  background:
    linear-gradient(
      180deg,
      rgba(8, 18, 19, 0.92),
      rgba(12, 22, 23, 0.78)
    );

  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);

  border-bottom:
    1px solid rgba(255,255,255,0.06);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.18);
}
    .header.compact {
  padding-top: 8px;
  padding-bottom: 8px;
}

.header.compact .logo {
  max-height: 0;
  opacity: 0;
  margin-bottom: 0;
  overflow: hidden;
  transform: translateY(-6px);
}

.header .logo {
  transition:
    opacity 0.25s ease,
    max-height 0.25s ease,
    margin 0.25s ease,
    transform 0.25s ease;

  max-height: 40px;
}

.header {
  transition:
    padding 0.25s ease,
    background 0.25s ease;
}

    .logo {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;

  color: rgba(255,255,255,0.72);

  margin-bottom: 9px;
}

    .search {
  width: 100%;
  padding: 13px 16px;

  border:
    1px solid rgba(255,255,255,0.10);

  border-radius: 16px;

  background:
    rgba(255,255,255,0.07);

  color: #ffffff;

  font-size: 16px;

  outline: none;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.04);
}

.search::placeholder {
  color: rgba(255,255,255,0.45);
}

.search:focus {
  border-color:
    rgba(176, 118, 55, 0.55);

  background:
    rgba(255,255,255,0.10);

  box-shadow:
    0 0 0 3px rgba(176,118,55,0.10);
}

    .container {
  padding: 18px 14px 50px;

  background:
    linear-gradient(
      180deg,
      rgba(10, 21, 23, 0.96),
      rgba(20, 16, 13, 0.96)
    );

  position: relative;
}
    .container::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;

  background:
    repeating-linear-gradient(
      90deg,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 5px
    ),
    radial-gradient(
      circle at 50% 0%,
      rgba(76, 142, 147, 0.08),
      transparent 40%
    );

  mix-blend-mode: screen;
}

    .section {
      margin-bottom: 28px;
    }

    .section-title {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 14px;

  color: #f3eee5;
  text-shadow: 0 2px 12px rgba(0,0,0,0.35);
}

    .cards {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding-bottom: 6px;
    }

    .card {
  min-width: 78vw;
  max-width: 320px;

  background:
    linear-gradient(
      180deg,
      rgba(33, 30, 27, 0.96),
      rgba(20, 18, 16, 0.98)
    );

  color: #f6f2eb;

  border-radius: 18px;
  overflow: hidden;
  scroll-snap-align: start;

  border: 1px solid rgba(255,255,255,0.06);

  box-shadow:
    0 10px 30px rgba(0,0,0,0.28),
    inset 0 1px 0 rgba(255,255,255,0.03);
}

    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #ddd;
    }

    .card-content {
      padding: 14px;
    }

    .dish-name {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .description {
    font-size: 15px;
    line-height: 1.5;
    color: #d7d1c9;
    margin-bottom: 10px;
}

.ingredients,
.waiter-note {
    font-size: 14px;
    line-height: 1.5;
    margin-top: 8px;
    color: #ece6dd;
}

    .label {
      font-weight: 700;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <section class="hero">
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div class="hero-logo">
  <img src="IMG_8730.png" alt="Fish Point">
</div>
    <div class="hero-subtitle">
      Меню и обучение официантов
    </div>

    <div class="hero-scroll">
      ↓
    </div>
  </div>
</section>
  <header class="header">
    <div class="logo">Fish Point</div>
    <input
      id="searchInput"
      class="search"
      type="text"
      placeholder="Поиск блюда..."
    />
  </header>

  <main class="container" id="menuContainer">
  <div>Загрузка меню...</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const SUPABASE_URL = "https://amvdqxpndhlbufubiosk.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Qx1-_jeg3aSK0cko4fQPoA_BirwNKz4";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const menuContainer = document.getElementById("menuContainer");
  const searchInput = document.getElementById("searchInput");

  let allSections = [];
  let allDishes = [];

  async function loadMenu() {
    const { data: sections, error: sectionsError } =
      await supabaseClient
        .from("sections")
        .select("*")
        .order("sort_order", { ascending: true });

    const { data: dishes, error: dishesError } =
      await supabaseClient
        .from("dishes")
        .select("*")
        .eq("is_visible", true)
        .order("sort_order", { ascending: true });

    if (sectionsError || dishesError) {
      console.error(sectionsError || dishesError);
      menuContainer.innerHTML = "Ошибка загрузки меню";
      return;
    }

    allSections = sections || [];
    allDishes = dishes || [];

    renderMenu();
  }

  function renderMenu(searchValue = "") {
    const query = searchValue.toLowerCase().trim();

    menuContainer.innerHTML = "";

    allSections.forEach(section => {
      const dishes = allDishes.filter(dish =>
        dish.section_id === section.id &&
        (!query || dish.name.toLowerCase().includes(query))
      );

      if (!dishes.length) return;

      const sectionElement = document.createElement("section");
      sectionElement.className = "section";

      sectionElement.innerHTML = `
        <div class="section-title">${section.name}</div>
        <div class="cards"></div>
      `;

      const cardsContainer =
        sectionElement.querySelector(".cards");

      dishes.forEach(dish => {
        const card = document.createElement("article");
        card.className = "card";

        const image =
          dish.photo_url ||
          "https://placehold.co/600x400?text=Fish+Point";

        card.innerHTML = `
          <img src="${image}" alt="${dish.name}">

          <div class="card-content">

            <div class="dish-name">
              ${dish.name}
            </div>

            <div class="description">
              ${dish.short_description || ""}
            </div>

            <div class="ingredients">
              <span class="label">Состав:</span>
              ${dish.ingredients || ""}
            </div>

            <div class="waiter-note">
              <span class="label">Официанту:</span>
              ${dish.waiter_note || ""}
            </div>

          </div>
        `;

        cardsContainer.appendChild(card);
      });

      menuContainer.appendChild(sectionElement);
    });

    if (!menuContainer.children.length) {
      menuContainer.innerHTML = "Ничего не найдено";
    }
  }

  searchInput.addEventListener("input", function () {
    renderMenu(this.value);
  });

  loadMenu();
  const hero = document.querySelector(".hero");
const heroContent = document.querySelector(".hero-content");

window.addEventListener("scroll", () => {
  if (!hero || !heroContent) return;

  const heroHeight = hero.offsetHeight;
  const scrollY = window.scrollY;

  // 0 в начале, 1 когда hero почти прокручен
  const progress = Math.min(
    Math.max(scrollY / (heroHeight * 0.85), 0),
    1
  );
  const header = document.querySelector(".header");

window.addEventListener("scroll", () => {
  if (!header) return;

  if (window.scrollY > 120) {
    header.classList.add("compact");
  } else {
    header.classList.remove("compact");
  }
});

  const scale = 1 - progress * 0.38;
  const opacity = 1 - progress;
  const blur = progress * 5;
  const moveY = progress * 70;

  heroContent.style.transform =
    `translateY(${moveY}px) scale(${scale})`;

  heroContent.style.opacity = opacity;
  heroContent.style.filter = `blur(${blur}px)`;
  const heroOpacity = 1 - progress * 0.92;
const heroScale = 1 - progress * 0.04;

hero.style.opacity = heroOpacity;
hero.style.transform = `scale(${heroScale})`;
});
</script>

</body>
</html>
