<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fish Point — Админка</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-top: 4px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 14px rgba(0,0,0,.06);
    }

    .card-title {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d0d0d0;
      border-radius: 12px;
      padding: 12px;
      background: white;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #111;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 14px 0;
    }

    .checkbox-row input {
      width: auto;
      transform: scale(1.3);
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      background: #111;
      color: white;
    }

    .btn-secondary {
      background: #e9e9e9;
      color: #111;
    }

    .btn-danger {
      background: #ffe5e5;
      color: #b00020;
    }

    .btn-small {
      padding: 8px 11px;
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .login-box {
      max-width: 420px;
      margin: 70px auto;
    }

    .message {
      margin-top: 12px;
      font-size: 14px;
    }

    .error {
      color: #b00020;
    }

    .success {
      color: #087b35;
    }

    .section-row,
    .dish-row {
      border-top: 1px solid #eee;
      padding: 14px 0;
    }

    .section-row:first-child,
    .dish-row:first-child {
      border-top: 0;
    }

    .row-title {
      font-weight: 800;
      font-size: 17px;
      margin-bottom: 5px;
    }

    .row-meta {
      color: #666;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .dish-photo {
      width: 92px;
      height: 72px;
      object-fit: cover;
      border-radius: 10px;
      background: #ddd;
    }

    .dish-top {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .dish-info {
      flex: 1;
    }

    .hidden-badge {
      display: inline-block;
      background: #eee;
      color: #555;
      font-size: 12px;
      padding: 4px 7px;
      border-radius: 999px;
      margin-left: 5px;
    }

    .photo-preview {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 14px;
      margin-top: 10px;
      display: none;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .loading {
      color: #666;
      padding: 15px 0;
    }

    .empty {
      color: #777;
      padding: 15px 0;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<div class="page">

  <!-- ВХОД -->
  <section id="loginView" class="login-box">
    <div class="card">
      <div class="card-title">Fish Point — вход</div>

      <div class="field">
        <label>Email</label>
        <input id="loginEmail" type="email" autocomplete="email">
      </div>

      <div class="field">
        <label>Пароль</label>
        <input id="loginPassword" type="password" autocomplete="current-password">
      </div>

      <button id="loginButton" class="btn btn-primary">
        Войти
      </button>

      <div id="loginMessage" class="message"></div>
    </div>
  </section>


  <!-- АДМИНКА -->
  <main id="adminView" class="hidden">

    <header class="header">
      <div>
        <div class="title">Fish Point</div>
        <div class="subtitle">Управление меню</div>
      </div>

      <div class="top-actions">
        <button
          id="logoutButton"
          class="btn btn-secondary btn-small"
        >
          Выйти
        </button>
      </div>
    </header>


    <!-- РАЗДЕЛЫ -->
    <section class="card">

      <div class="card-title">
        Разделы меню
      </div>

      <div class="field">
        <label>Название нового раздела</label>
        <input
          id="sectionName"
          type="text"
          placeholder="Например: Салаты"
        >
      </div>

      <div class="field">
        <label>Порядок</label>
        <input
          id="sectionSortOrder"
          type="number"
          value="0"
        >
      </div>

      <button
        id="addSectionButton"
        class="btn btn-primary"
      >
        Добавить раздел
      </button>

      <div id="sectionsMessage" class="message"></div>

      <div id="sectionsList"></div>

    </section>


    <!-- БЛЮДО -->
    <section class="card">

      <div id="dishFormTitle" class="card-title">
        Добавить блюдо
      </div>

      <div class="field">
        <label>Раздел</label>
        <select id="dishSection"></select>
      </div>

      <div class="field">
        <label>Название блюда</label>
        <input
          id="dishName"
          type="text"
          placeholder="Название"
        >
      </div>

      <div class="field">
        <label>Короткое описание</label>
        <textarea
          id="dishDescription"
          placeholder="Краткое описание блюда"
        ></textarea>
      </div>

      <div class="field">
        <label>Состав</label>
        <textarea
          id="dishIngredients"
          placeholder="Ингредиенты"
        ></textarea>
      </div>

      <div class="field">
        <label>Подсказка официанту</label>
        <textarea
          id="dishWaiterNote"
          placeholder="Что важно знать официанту"
        ></textarea>
      </div>

      <div class="field">
        <label>Фото блюда</label>
        <input
          id="dishPhoto"
          type="file"
          accept="image/*"
        >

        <img
          id="photoPreview"
          class="photo-preview"
          alt="Предпросмотр"
        >
      </div>

      <div class="field">
        <label>Порядок</label>
        <input
          id="dishSortOrder"
          type="number"
          value="0"
        >
      </div>

      <div class="checkbox-row">
        <input
          id="dishVisible"
          type="checkbox"
          checked
        >
        <label for="dishVisible">
          Показывать блюдо на сайте
        </label>
      </div>

      <div class="actions">

        <button
          id="saveDishButton"
          class="btn btn-primary"
        >
          Сохранить блюдо
        </button>

        <button
          id="cancelEditButton"
          class="btn btn-secondary hidden"
        >
          Отменить редактирование
        </button>

      </div>

      <div id="dishMessage" class="message"></div>

    </section>


    <!-- СПИСОК БЛЮД -->
    <section class="card">

      <div class="card-title">
        Все блюда
      </div>

      <div class="field">
        <input
          id="adminSearch"
          type="text"
          placeholder="Поиск блюда..."
        >
      </div>

      <div id="dishesList"></div>

    </section>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://amvdqxpndhlbufubiosk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Qx1-_jeg3aSK0cko4fQPoA_BirwNKz4";


const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let sections = [];
let dishes = [];

let editingDishId = null;
let editingPhotoUrl = "";



/* =========================
   ЭЛЕМЕНТЫ
========================= */

const loginView =
  document.getElementById("loginView");

const adminView =
  document.getElementById("adminView");

const loginEmail =
  document.getElementById("loginEmail");

const loginPassword =
  document.getElementById("loginPassword");

const loginButton =
  document.getElementById("loginButton");

const loginMessage =
  document.getElementById("loginMessage");

const logoutButton =
  document.getElementById("logoutButton");


const sectionName =
  document.getElementById("sectionName");

const sectionSortOrder =
  document.getElementById("sectionSortOrder");

const addSectionButton =
  document.getElementById("addSectionButton");

const sectionsList =
  document.getElementById("sectionsList");

const sectionsMessage =
  document.getElementById("sectionsMessage");


const dishSection =
  document.getElementById("dishSection");

const dishName =
  document.getElementById("dishName");

const dishDescription =
  document.getElementById("dishDescription");

const dishIngredients =
  document.getElementById("dishIngredients");

const dishWaiterNote =
  document.getElementById("dishWaiterNote");

const dishPhoto =
  document.getElementById("dishPhoto");

const photoPreview =
  document.getElementById("photoPreview");

const dishSortOrder =
  document.getElementById("dishSortOrder");

const dishVisible =
  document.getElementById("dishVisible");

const saveDishButton =
  document.getElementById("saveDishButton");

const cancelEditButton =
  document.getElementById("cancelEditButton");

const dishMessage =
  document.getElementById("dishMessage");

const dishFormTitle =
  document.getElementById("dishFormTitle");

const dishesList =
  document.getElementById("dishesList");

const adminSearch =
  document.getElementById("adminSearch");



/* =========================
   АВТОРИЗАЦИЯ
========================= */

async function checkSession() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (session) {
    showAdmin();
  } else {
    showLogin();
  }
}


function showLogin() {
  loginView.classList.remove("hidden");
  adminView.classList.add("hidden");
}


async function showAdmin() {

  loginView.classList.add("hidden");
  adminView.classList.remove("hidden");

  await loadAll();
}


loginButton.addEventListener(
  "click",
  async () => {

    loginMessage.textContent = "Вход...";

    const email =
      loginEmail.value.trim();

    const password =
      loginPassword.value;

    const { error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) {
      loginMessage.className =
        "message error";

      loginMessage.textContent =
        "Ошибка входа: " + error.message;

      return;
    }

    loginMessage.textContent = "";

    showAdmin();
  }
);


logoutButton.addEventListener(
  "click",
  async () => {

    await supabaseClient.auth.signOut();

    showLogin();
  }
);



/* =========================
   ЗАГРУЗКА ДАННЫХ
========================= */

async function loadAll() {

  await loadSections();
  await loadDishes();

}


async function loadSections() {

  sectionsList.innerHTML =
    '<div class="loading">Загрузка...</div>';

  const {
    data,
    error
  } = await supabaseClient
    .from("sections")
    .select("*")
    .order("sort_order", {
      ascending: true
    });

  if (error) {

    sectionsList.innerHTML =
      `<div class="error">${escapeHtml(error.message)}</div>`;

    return;
  }

  sections = data || [];

  renderSections();
  fillSectionSelect();
}


async function loadDishes() {

  dishesList.innerHTML =
    '<div class="loading">Загрузка...</div>';

  const {
    data,
    error
  } = await supabaseClient
    .from("dishes")
    .select("*")
    .order("sort_order", {
      ascending: true
    });

  if (error) {

    dishesList.innerHTML =
      `<div class="error">${escapeHtml(error.message)}</div>`;

    return;
  }

  dishes = data || [];

  renderDishes();
}



/* =========================
   РАЗДЕЛЫ
========================= */

addSectionButton.addEventListener(
  "click",
  async () => {

    const name =
      sectionName.value.trim();

    if (!name) {

      sectionsMessage.className =
        "message error";

      sectionsMessage.textContent =
        "Введите название раздела.";

      return;
    }

    sectionsMessage.textContent =
      "Сохранение...";

    const { error } =
      await supabaseClient
        .from("sections")
        .insert({
          name: name,
          sort_order:
            Number(sectionSortOrder.value) || 0
        });

    if (error) {

      sectionsMessage.className =
        "message error";

      sectionsMessage.textContent =
        error.message;

      return;
    }

    sectionName.value = "";
    sectionSortOrder.value = "0";

    sectionsMessage.className =
      "message success";

    sectionsMessage.textContent =
      "Раздел добавлен.";

    await loadSections();
  }
);


function renderSections() {

  if (!sections.length) {

    sectionsList.innerHTML =
      '<div class="empty">Разделов пока нет.</div>';

    return;
  }

  sectionsList.innerHTML = "";

  sections.forEach(section => {

    const row =
      document.createElement("div");

    row.className = "section-row";

    row.innerHTML = `
      <div class="row-title">
        ${escapeHtml(section.name)}
      </div>

      <div class="row-meta">
        Порядок: ${section.sort_order ?? 0}
      </div>

      <div class="actions">

        <button
          class="btn btn-secondary btn-small"
          onclick="renameSection(${section.id})"
        >
          Изменить
        </button>

        <button
          class="btn btn-danger btn-small"
          onclick="deleteSection(${section.id})"
        >
          Удалить
        </button>

      </div>
    `;

    sectionsList.appendChild(row);
  });
}


async function renameSection(id) {

  const section =
    sections.find(s => s.id === id);

  if (!section) return;

  const newName =
    prompt(
      "Новое название раздела:",
      section.name
    );

  if (!newName) return;

  const newOrder =
    prompt(
      "Порядок:",
      section.sort_order ?? 0
    );

  const { error } =
    await supabaseClient
      .from("sections")
      .update({
        name: newName.trim(),
        sort_order:
          Number(newOrder) || 0
      })
      .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  await loadAll();
}


async function deleteSection(id) {

  const section =
    sections.find(s => s.id === id);

  if (!section) return;

  const ok =
    confirm(
      `Удалить раздел "${section.name}"?\n\nВсе блюда этого раздела тоже будут удалены.`
    );

  if (!ok) return;

  const { error } =
    await supabaseClient
      .from("sections")
      .delete()
      .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  await loadAll();
}


function fillSectionSelect() {

  dishSection.innerHTML = "";

  sections.forEach(section => {

    const option =
      document.createElement("option");

    option.value = section.id;
    option.textContent = section.name;

    dishSection.appendChild(option);
  });
}



/* =========================
   ФОТО
========================= */

dishPhoto.addEventListener(
  "change",
  () => {

    const file =
      dishPhoto.files[0];

    if (!file) {
      return;
    }

    photoPreview.src =
      URL.createObjectURL(file);

    photoPreview.style.display =
      "block";
  }
);


async function uploadPhoto(file) {

  if (!file) {
    return editingPhotoUrl || "";
  }

  const extension =
    file.name.split(".").pop() || "jpg";

  const safeExtension =
    extension.toLowerCase();

  const fileName =
    `${Date.now()}-${Math.random()
      .toString(36)
      .slice(2)}.${safeExtension}`;

  const {
    error
  } = await supabaseClient.storage
    .from("dish-images")
    .upload(
      fileName,
      file,
      {
        cacheControl: "3600",
        upsert: false
      }
    );

  if (error) {
    throw error;
  }

  const {
    data
  } = supabaseClient.storage
    .from("dish-images")
    .getPublicUrl(fileName);

  return data.publicUrl;
}



/* =========================
   СОХРАНЕНИЕ БЛЮДА
========================= */

saveDishButton.addEventListener(
  "click",
  async () => {

    if (!sections.length) {

      dishMessage.className =
        "message error";

      dishMessage.textContent =
        "Сначала создайте хотя бы один раздел.";

      return;
    }

    const name =
      dishName.value.trim();

    if (!name) {

      dishMessage.className =
        "message error";

      dishMessage.textContent =
        "Введите название блюда.";

      return;
    }

    saveDishButton.disabled = true;

    dishMessage.className = "message";
    dishMessage.textContent =
      "Сохранение...";

    try {

      const file =
        dishPhoto.files[0];

      const photoUrl =
        await uploadPhoto(file);

      const payload = {

        section_id:
          Number(dishSection.value),

        name:
          name,

        short_description:
          dishDescription.value.trim(),

        ingredients:
          dishIngredients.value.trim(),

        waiter_note:
          dishWaiterNote.value.trim(),

        photo_url:
          photoUrl,

        is_visible:
          dishVisible.checked,

        sort_order:
          Number(dishSortOrder.value) || 0,

        updated_at:
          new Date().toISOString()
      };


      let result;


      if (editingDishId) {

        result =
          await supabaseClient
            .from("dishes")
            .update(payload)
            .eq(
              "id",
              editingDishId
            );

      } else {

        result =
          await supabaseClient
            .from("dishes")
            .insert(payload);

      }


      if (result.error) {
        throw result.error;
      }


      dishMessage.className =
        "message success";

      dishMessage.textContent =
        editingDishId
          ? "Блюдо обновлено."
          : "Блюдо добавлено.";


      resetDishForm();

      await loadDishes();


    } catch (error) {

      dishMessage.className =
        "message error";

      dishMessage.textContent =
        "Ошибка: " + error.message;

    } finally {

      saveDishButton.disabled =
        false;
    }
  }
);



/* =========================
   СПИСОК БЛЮД
========================= */

function renderDishes() {

  const search =
    adminSearch.value
      .toLowerCase()
      .trim();

  const filtered =
    dishes.filter(dish =>
      dish.name
        .toLowerCase()
        .includes(search)
    );


  if (!filtered.length) {

    dishesList.innerHTML =
      '<div class="empty">Блюд не найдено.</div>';

    return;
  }


  dishesList.innerHTML = "";


  filtered.forEach(dish => {

    const section =
      sections.find(
        s => s.id === dish.section_id
      );

    const row =
      document.createElement("div");

    row.className = "dish-row";


    const photo =
      dish.photo_url
        ? `<img
            class="dish-photo"
            src="${escapeHtml(dish.photo_url)}"
            alt=""
          >`
        : `<div class="dish-photo"></div>`;


    row.innerHTML = `

      <div class="dish-top">

        ${photo}

        <div class="dish-info">

          <div class="row-title">

            ${escapeHtml(dish.name)}

            ${
              !dish.is_visible
                ? '<span class="hidden-badge">Скрыто</span>'
                : ""
            }

          </div>

          <div class="row-meta">
            ${escapeHtml(section?.name || "Без раздела")}
            · порядок ${dish.sort_order ?? 0}
          </div>

          <div class="actions">

            <button
              class="btn btn-secondary btn-small"
              onclick="editDish(${dish.id})"
            >
              Изменить
            </button>

            <button
              class="btn btn-secondary btn-small"
              onclick="toggleDishVisibility(${dish.id})"
            >
              ${
                dish.is_visible
                  ? "Скрыть"
                  : "Показать"
              }
            </button>

            <button
              class="btn btn-danger btn-small"
              onclick="deleteDish(${dish.id})"
            >
              Удалить
            </button>

          </div>

        </div>

      </div>
    `;


    dishesList.appendChild(row);
  });
}


adminSearch.addEventListener(
  "input",
  renderDishes
);



/* =========================
   РЕДАКТИРОВАНИЕ
========================= */

function editDish(id) {

  const dish =
    dishes.find(d => d.id === id);

  if (!dish) return;


  editingDishId =
    dish.id;

  editingPhotoUrl =
    dish.photo_url || "";


  dishSection.value =
    dish.section_id;

  dishName.value =
    dish.name || "";

  dishDescription.value =
    dish.short_description || "";

  dishIngredients.value =
    dish.ingredients || "";

  dishWaiterNote.value =
    dish.waiter_note || "";

  dishSortOrder.value =
    dish.sort_order ?? 0;

  dishVisible.checked =
    dish.is_visible;


  if (dish.photo_url) {

    photoPreview.src =
      dish.photo_url;

    photoPreview.style.display =
      "block";

  } else {

    photoPreview.removeAttribute(
      "src"
    );

    photoPreview.style.display =
      "none";
  }


  dishFormTitle.textContent =
    "Редактировать блюдо";

  saveDishButton.textContent =
    "Сохранить изменения";

  cancelEditButton.classList
    .remove("hidden");


  window.scrollTo({
    top:
      document
        .getElementById(
          "dishFormTitle"
        )
        .offsetTop - 20,

    behavior: "smooth"
  });
}


cancelEditButton.addEventListener(
  "click",
  resetDishForm
);


function resetDishForm() {

  editingDishId = null;
  editingPhotoUrl = "";

  dishName.value = "";
  dishDescription.value = "";
  dishIngredients.value = "";
  dishWaiterNote.value = "";
  dishPhoto.value = "";
  dishSortOrder.value = "0";
  dishVisible.checked = true;

  photoPreview.removeAttribute("src");
  photoPreview.style.display = "none";

  dishFormTitle.textContent =
    "Добавить блюдо";

  saveDishButton.textContent =
    "Сохранить блюдо";

  cancelEditButton.classList
    .add("hidden");
}



/* =========================
   ВИДИМОСТЬ
========================= */

async function toggleDishVisibility(id) {

  const dish =
    dishes.find(d => d.id === id);

  if (!dish) return;

  const { error } =
    await supabaseClient
      .from("dishes")
      .update({
        is_visible:
          !dish.is_visible,

        updated_at:
          new Date().toISOString()
      })
      .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  await loadDishes();
}



/* =========================
   УДАЛЕНИЕ
========================= */

async function deleteDish(id) {

  const dish =
    dishes.find(d => d.id === id);

  if (!dish) return;


  const ok =
    confirm(
      `Удалить блюдо "${dish.name}"?`
    );

  if (!ok) return;


  const { error } =
    await supabaseClient
      .from("dishes")
      .delete()
      .eq("id", id);


  if (error) {

    alert(error.message);

    return;
  }


  await loadDishes();
}



/* =========================
   БЕЗОПАСНЫЙ HTML
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}



/* =========================
   СТАРТ
========================= */

checkSession();

</script>
