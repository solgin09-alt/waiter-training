<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fish Point — Админка</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #111111;
      --muted: #747474;
      --border: #e7e7e7;
      --black: #111111;
      --danger: #c62828;
      --danger-bg: #fff0f0;
      --success: #137333;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .page {
      max-width: 760px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 80px;
    }

    .login {
      max-width: 420px;
      margin: 70px auto 0;
    }

    .brand {
      font-size: 30px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .muted {
      color: var(--muted);
    }

    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 17px;
      margin-bottom: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.045);
    }

    .card-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .field {
      margin-bottom: 13px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d8d8d8;
      border-radius: 13px;
      background: white;
      padding: 12px 13px;
      outline: none;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #777;
    }

    .btn {
      border: 0;
      border-radius: 13px;
      padding: 12px 15px;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--black);
      color: white;
    }

    .btn-light {
      background: #eeeeee;
      color: var(--text);
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .btn-small {
      padding: 8px 11px;
      font-size: 13px;
    }

    .btn-full {
      width: 100%;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .topbar-title {
      font-size: 26px;
      font-weight: 850;
    }

    .topbar-subtitle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #e8e8e8;
      border-radius: 15px;
      padding: 4px;
      margin-bottom: 14px;
    }

    .tab {
      border: 0;
      background: transparent;
      border-radius: 12px;
      padding: 10px;
      font-weight: 750;
    }

    .tab.active {
      background: white;
      box-shadow: 0 1px 5px rgba(0,0,0,.07);
    }

    .main-action {
      width: 100%;
      font-size: 16px;
      margin-bottom: 14px;
    }

    .search {
      margin-bottom: 14px;
    }

    .dish {
      display: flex;
      gap: 12px;
      padding: 13px 0;
      border-top: 1px solid var(--border);
    }

    .dish:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .dish-photo {
      width: 92px;
      height: 82px;
      border-radius: 14px;
      background: #ececec;
      object-fit: cover;
      flex-shrink: 0;
    }

    .dish-info {
      flex: 1;
      min-width: 0;
    }

    .dish-name {
      font-weight: 800;
      font-size: 17px;
      margin-bottom: 4px;
    }

    .dish-meta {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 9px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      border-radius: 20px;
      padding: 3px 7px;
      margin-left: 5px;
      background: #ededed;
      color: #666;
      vertical-align: 2px;
    }

    .section-item {
      padding: 14px 0;
      border-top: 1px solid var(--border);
    }

    .section-item:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .section-name {
      font-weight: 800;
      font-size: 17px;
      margin-bottom: 4px;
    }

    .section-meta {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 9px;
    }

    .checkbox {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 15px;
    }

    .checkbox input {
      width: auto;
      transform: scale(1.25);
    }

    .photo-preview {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 15px;
      display: none;
      margin-top: 10px;
    }

    .message {
      font-size: 13px;
      margin-top: 10px;
    }

    .message.error {
      color: var(--danger);
    }

    .message.success {
      color: var(--success);
    }

    .empty {
      color: var(--muted);
      padding: 18px 0;
      text-align: center;
    }

    .form-actions {
      display: flex;
      gap: 8px;
    }

    .form-actions .btn {
      flex: 1;
    }
  </style>
</head>

<body>

<div class="page">

  <!-- ВХОД -->
  <section id="loginView" class="login">
    <div class="card">
      <div class="brand">Fish Point</div>
      <div class="muted" style="margin-bottom:22px;">
        Вход в управление меню
      </div>

      <div class="field">
        <label>Email</label>
        <input id="loginEmail" type="email" autocomplete="email">
      </div>

      <div class="field">
        <label>Пароль</label>
        <input id="loginPassword" type="password" autocomplete="current-password">
      </div>

      <button id="loginBtn" class="btn btn-primary btn-full">
        Войти
      </button>

      <div id="loginMessage" class="message"></div>
    </div>
  </section>


  <!-- АДМИНКА -->
  <main id="adminView" class="hidden">

    <div class="topbar">
      <div>
        <div class="topbar-title">Fish Point</div>
        <div class="topbar-subtitle">Управление меню</div>
      </div>

      <button id="logoutBtn" class="btn btn-light btn-small">
        Выйти
      </button>
    </div>


    <div class="tabs">
      <button id="dishesTab" class="tab active">Блюда</button>
      <button id="sectionsTab" class="tab">Разделы</button>
    </div>


    <!-- ================= БЛЮДА ================= -->

    <section id="dishesView">

      <button id="openDishFormBtn" class="btn btn-primary main-action">
        + Добавить блюдо
      </button>


      <div id="dishFormCard" class="card hidden">

        <div id="dishFormTitle" class="card-title">
          Новое блюдо
        </div>

        <div class="field">
          <label>Раздел</label>
          <select id="dishSection"></select>
        </div>

        <div class="field">
          <label>Название</label>
          <input id="dishName" type="text">
        </div>

        <div class="field">
          <label>Короткое описание</label>
          <textarea id="dishDescription"></textarea>
        </div>

        <div class="field">
          <label>Состав</label>
          <textarea id="dishIngredients"></textarea>
        </div>

        <div class="field">
          <label>Подсказка официанту</label>
          <textarea id="dishWaiterNote"></textarea>
        </div>
<div class="card" id="dishPreviewCard" style="padding:0; overflow:hidden;">

  <img
    id="dishPreviewImage"
    src=""
    alt=""
    style="
      width:100%;
      height:220px;
      object-fit:cover;
      background:#ececec;
      display:none;
    "
  >

  <div style="padding:16px;">

    <div
      id="dishPreviewName"
      style="
        font-size:22px;
        font-weight:800;
        margin-bottom:8px;
      "
    >
      Название блюда
    </div>

    <div
      id="dishPreviewDescription"
      style="
        color:#444;
        line-height:1.45;
        margin-bottom:10px;
      "
    >
      Короткое описание
    </div>

    <div style="margin-bottom:8px;">
      <strong>Состав:</strong>
      <span id="dishPreviewIngredients">—</span>
    </div>

    <div>
      <strong>Официанту:</strong>
      <span id="dishPreviewNote">—</span>
    </div>

  </div>
        <div class="field">
          <label>Фото</label>
          <input id="dishPhoto" type="file" accept="image/*">
          <img id="photoPreview" class="photo-preview">
        </div>

        <div class="field">
          <label>Порядок</label>
          <input id="dishOrder" type="number" value="0">
        </div>

        <div class="checkbox">
          <input id="dishVisible" type="checkbox" checked>
          <label for="dishVisible">
            Показывать на основном сайте
          </label>
        </div>

        <div class="form-actions">
          <button id="saveDishBtn" class="btn btn-primary">
            Сохранить
          </button>

          <button id="cancelDishBtn" class="btn btn-light">
            Отмена
          </button>
        </div>

        <div id="dishMessage" class="message"></div>
      </div>


      <div class="card">

        <input
          id="dishSearch"
          class="search"
          type="text"
          placeholder="Поиск блюда..."
        >

        <div id="dishesList">
          <div class="empty">Загрузка...</div>
        </div>

      </div>
    </section>


    <!-- ================= РАЗДЕЛЫ ================= -->

    <section id="sectionsView" class="hidden">

      <button id="openSectionFormBtn" class="btn btn-primary main-action">
        + Добавить раздел
      </button>


      <div id="sectionFormCard" class="card hidden">

        <div id="sectionFormTitle" class="card-title">
          Новый раздел
        </div>

        <div class="field">
          <label>Название</label>
          <input id="sectionName" type="text">
        </div>

        <div class="field">
          <label>Порядок</label>
          <input id="sectionOrder" type="number" value="0">
        </div>

        <div class="form-actions">
          <button id="saveSectionBtn" class="btn btn-primary">
            Сохранить
          </button>

          <button id="cancelSectionBtn" class="btn btn-light">
            Отмена
          </button>
        </div>

        <div id="sectionMessage" class="message"></div>
      </div>


      <div class="card">
        <div id="sectionsList">
          <div class="empty">Загрузка...</div>
        </div>
      </div>

    </section>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://amvdqxpndhlbufubiosk.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Qx1-_jeg3aSK0cko4fQPoA_BirwNKz4";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let sections = [];
let dishes = [];

let editingDishId = null;
let oldPhotoUrl = "";

let editingSectionId = null;


/* ---------- ЭЛЕМЕНТЫ ---------- */

const loginView = document.getElementById("loginView");
const adminView = document.getElementById("adminView");

const loginEmail = document.getElementById("loginEmail");
const loginPassword = document.getElementById("loginPassword");
const loginBtn = document.getElementById("loginBtn");
const loginMessage = document.getElementById("loginMessage");
const logoutBtn = document.getElementById("logoutBtn");

const dishesTab = document.getElementById("dishesTab");
const sectionsTab = document.getElementById("sectionsTab");

const dishesView = document.getElementById("dishesView");
const sectionsView = document.getElementById("sectionsView");

const dishesList = document.getElementById("dishesList");
const sectionsList = document.getElementById("sectionsList");

const dishSearch = document.getElementById("dishSearch");

const openDishFormBtn = document.getElementById("openDishFormBtn");
const dishFormCard = document.getElementById("dishFormCard");
const dishFormTitle = document.getElementById("dishFormTitle");

const dishSection = document.getElementById("dishSection");
const dishName = document.getElementById("dishName");
const dishDescription = document.getElementById("dishDescription");
const dishIngredients = document.getElementById("dishIngredients");
const dishWaiterNote = document.getElementById("dishWaiterNote");
const dishPhoto = document.getElementById("dishPhoto");
const photoPreview = document.getElementById("photoPreview");
const dishOrder = document.getElementById("dishOrder");
const dishVisible = document.getElementById("dishVisible");
const saveDishBtn = document.getElementById("saveDishBtn");
const cancelDishBtn = document.getElementById("cancelDishBtn");
const dishMessage = document.getElementById("dishMessage");
const dishPreviewName =
  document.getElementById("dishPreviewName");

const dishPreviewDescription =
  document.getElementById("dishPreviewDescription");

const dishPreviewIngredients =
  document.getElementById("dishPreviewIngredients");

const dishPreviewNote =
  document.getElementById("dishPreviewNote");

const dishPreviewImage =
  document.getElementById("dishPreviewImage");
const openSectionFormBtn = document.getElementById("openSectionFormBtn");
const sectionFormCard = document.getElementById("sectionFormCard");
const sectionFormTitle = document.getElementById("sectionFormTitle");
const sectionName = document.getElementById("sectionName");
const sectionOrder = document.getElementById("sectionOrder");
const saveSectionBtn = document.getElementById("saveSectionBtn");
const cancelSectionBtn = document.getElementById("cancelSectionBtn");
const sectionMessage = document.getElementById("sectionMessage");
function updateDishPreview() {

  dishPreviewName.textContent =
    dishName.value.trim() || "Название блюда";

  dishPreviewDescription.textContent =
    dishDescription.value.trim() || "Короткое описание";

  dishPreviewIngredients.textContent =
    dishIngredients.value.trim() || "—";

  dishPreviewNote.textContent =
    dishWaiterNote.value.trim() || "—";
}


dishName.addEventListener(
  "input",
  updateDishPreview
);

dishDescription.addEventListener(
  "input",
  updateDishPreview
);

dishIngredients.addEventListener(
  "input",
  updateDishPreview
);

dishWaiterNote.addEventListener(
  "input",
  updateDishPreview
);

/* ---------- ВХОД ---------- */

async function checkSession() {
  const {
    data: { session }
  } = await db.auth.getSession();

  if (session) {
    showAdmin();
  } else {
    loginView.classList.remove("hidden");
  }
}

loginBtn.addEventListener("click", async () => {
  loginMessage.className = "message";
  loginMessage.textContent = "Вход...";

  const { error } = await db.auth.signInWithPassword({
    email: loginEmail.value.trim(),
    password: loginPassword.value
  });

  if (error) {
    loginMessage.className = "message error";
    loginMessage.textContent = "Ошибка входа: " + error.message;
    return;
  }

  loginMessage.textContent = "";
  showAdmin();
});

logoutBtn.addEventListener("click", async () => {
  await db.auth.signOut();
  location.reload();
});

async function showAdmin() {
  loginView.classList.add("hidden");
  adminView.classList.remove("hidden");
  await loadAll();
}


/* ---------- ВКЛАДКИ ---------- */

dishesTab.addEventListener("click", () => {
  dishesTab.classList.add("active");
  sectionsTab.classList.remove("active");

  dishesView.classList.remove("hidden");
  sectionsView.classList.add("hidden");
});

sectionsTab.addEventListener("click", () => {
  sectionsTab.classList.add("active");
  dishesTab.classList.remove("active");

  sectionsView.classList.remove("hidden");
  dishesView.classList.add("hidden");
});


/* ---------- ЗАГРУЗКА ---------- */

async function loadAll() {
  await loadSections();
  await loadDishes();
}

async function loadSections() {
  const { data, error } = await db
    .from("sections")
    .select("*")
    .order("sort_order", { ascending: true })
    .order("id", { ascending: true });

  if (error) {
    sectionsList.innerHTML =
      `<div class="message error">${escapeHtml(error.message)}</div>`;
    return;
  }

  sections = data || [];

  renderSections();
  fillSectionSelect();
}

async function loadDishes() {
  const { data, error } = await db
    .from("dishes")
    .select("*")
    .order("sort_order", { ascending: true })
    .order("id", { ascending: true });

  if (error) {
    dishesList.innerHTML =
      `<div class="message error">${escapeHtml(error.message)}</div>`;
    return;
  }

  dishes = data || [];
  renderDishes();
}


/* ---------- РАЗДЕЛЫ ---------- */

openSectionFormBtn.addEventListener("click", () => {
  resetSectionForm();
  sectionFormCard.classList.remove("hidden");
  sectionName.focus();
});

cancelSectionBtn.addEventListener("click", () => {
  resetSectionForm();
  sectionFormCard.classList.add("hidden");
});

saveSectionBtn.addEventListener("click", async () => {
  const name = sectionName.value.trim();

  if (!name) {
    sectionMessage.className = "message error";
    sectionMessage.textContent = "Введите название раздела.";
    return;
  }

  saveSectionBtn.disabled = true;
  sectionMessage.className = "message";
  sectionMessage.textContent = "Сохранение...";

  const payload = {
    name,
    sort_order: Number(sectionOrder.value) || 0
  };

  let result;

  if (editingSectionId) {
    result = await db
      .from("sections")
      .update(payload)
      .eq("id", editingSectionId);
  } else {
    result = await db
      .from("sections")
      .insert(payload);
  }

  saveSectionBtn.disabled = false;

  if (result.error) {
    sectionMessage.className = "message error";
    sectionMessage.textContent = result.error.message;
    return;
  }

  sectionMessage.className = "message success";
  sectionMessage.textContent = "Сохранено.";

  await loadSections();

  setTimeout(() => {
    resetSectionForm();
    sectionFormCard.classList.add("hidden");
  }, 350);
});

function renderSections() {
  if (!sections.length) {
    sectionsList.innerHTML =
      '<div class="empty">Разделов пока нет</div>';
    return;
  }

  sectionsList.innerHTML = "";

  sections.forEach(section => {
    const count =
      dishes.filter(d => d.section_id === section.id).length;

    const item = document.createElement("div");
    item.className = "section-item";

    item.innerHTML = `
      <div class="section-name">
        ${escapeHtml(section.name)}
      </div>

      <div class="section-meta">
        Блюд: ${count} · порядок ${section.sort_order ?? 0}
      </div>

      <div class="actions">
        <button
          class="btn btn-light btn-small edit-section"
          data-id="${section.id}"
        >
          Изменить
        </button>

        <button
          class="btn btn-danger btn-small delete-section"
          data-id="${section.id}"
        >
          Удалить
        </button>
      </div>
    `;

    sectionsList.appendChild(item);
  });

  document.querySelectorAll(".edit-section").forEach(btn => {
    btn.addEventListener("click", () => {
      editSection(Number(btn.dataset.id));
    });
  });

  document.querySelectorAll(".delete-section").forEach(btn => {
    btn.addEventListener("click", () => {
      deleteSection(Number(btn.dataset.id));
    });
  });
}

function editSection(id) {
  const section = sections.find(s => s.id === id);
  if (!section) return;

  editingSectionId = id;

  sectionName.value = section.name;
  sectionOrder.value = section.sort_order ?? 0;

  sectionFormTitle.textContent = "Редактировать раздел";
  sectionFormCard.classList.remove("hidden");

  sectionFormCard.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

async function deleteSection(id) {
  const section = sections.find(s => s.id === id);
  if (!section) return;

  const count =
    dishes.filter(d => d.section_id === id).length;

  let text = `Удалить раздел «${section.name}»?`;

  if (count > 0) {
    text += `\n\nВ нём ${count} блюд. Они тоже будут удалены.`;
  }

  if (!confirm(text)) return;

  const { error } = await db
    .from("sections")
    .delete()
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  await loadAll();
}

function resetSectionForm() {
  editingSectionId = null;
  sectionName.value = "";
  sectionOrder.value = "0";
  sectionFormTitle.textContent = "Новый раздел";
  sectionMessage.textContent = "";
}


/* ---------- ВЫБОР РАЗДЕЛА ---------- */

function fillSectionSelect() {
  dishSection.innerHTML = "";

  if (!sections.length) {
    const option = document.createElement("option");
    option.textContent = "Сначала создайте раздел";
    option.value = "";
    dishSection.appendChild(option);
    return;
  }

  sections.forEach(section => {
    const option = document.createElement("option");

    option.value = section.id;
    option.textContent = section.name;

    dishSection.appendChild(option);
  });
}


/* ---------- ФОРМА БЛЮДА ---------- */

openDishFormBtn.addEventListener("click", () => {
  if (!sections.length) {
    alert("Сначала создайте хотя бы один раздел.");
    sectionsTab.click();
    return;
  }

  resetDishForm();
  dishFormCard.classList.remove("hidden");
  dishName.focus();
});

cancelDishBtn.addEventListener("click", () => {
  resetDishForm();
  dishFormCard.classList.add("hidden");
});

dishPhoto.addEventListener("change", () => {
  const file = dishPhoto.files[0];

  if (!file) return;

  const imageUrl = URL.createObjectURL(file);

  photoPreview.src = imageUrl;
  photoPreview.style.display = "block";

  dishPreviewImage.src = imageUrl;
  dishPreviewImage.style.display = "block";
});

async function uploadPhoto(file) {
  if (!file) return oldPhotoUrl || "";

  const extension =
    (file.name.split(".").pop() || "jpg").toLowerCase();

  const filename =
    `${Date.now()}-${Math.random().toString(36).slice(2)}.${extension}`;

  const { error } = await db.storage
    .from("dish-images")
    .upload(filename, file, {
      cacheControl: "3600",
      upsert: false
    });

  if (error) throw error;

  const { data } = db.storage
    .from("dish-images")
    .getPublicUrl(filename);

  return data.publicUrl;
}

saveDishBtn.addEventListener("click", async () => {
  if (!sections.length) {
    dishMessage.className = "message error";
    dishMessage.textContent =
      "Сначала создайте хотя бы один раздел.";
    return;
  }

  const name = dishName.value.trim();

  if (!name) {
    dishMessage.className = "message error";
    dishMessage.textContent = "Введите название блюда.";
    return;
  }

  saveDishBtn.disabled = true;
  dishMessage.className = "message";
  dishMessage.textContent = "Сохранение...";

  try {
    const photoUrl =
      await uploadPhoto(dishPhoto.files[0]);

    const payload = {
      section_id: Number(dishSection.value),
      name,
      short_description: dishDescription.value.trim(),
      ingredients: dishIngredients.value.trim(),
      waiter_note: dishWaiterNote.value.trim(),
      photo_url: photoUrl,
      is_visible: dishVisible.checked,
      sort_order: Number(dishOrder.value) || 0,
      updated_at: new Date().toISOString()
    };

    let result;

    if (editingDishId) {
      result = await db
        .from("dishes")
        .update(payload)
        .eq("id", editingDishId);
    } else {
      result = await db
        .from("dishes")
        .insert(payload);
    }

    if (result.error) throw result.error;

    dishMessage.className = "message success";
    dishMessage.textContent = "Сохранено.";

    await loadDishes();

    setTimeout(() => {
      resetDishForm();
      dishFormCard.classList.add("hidden");
    }, 350);

  } catch (error) {
    dishMessage.className = "message error";
    dishMessage.textContent =
      "Ошибка: " + error.message;
  }

  saveDishBtn.disabled = false;
});


/* ---------- СПИСОК БЛЮД ---------- */

dishSearch.addEventListener("input", renderDishes);

function renderDishes() {
  const search =
    dishSearch.value.toLowerCase().trim();

  const filtered = dishes.filter(dish =>
    dish.name.toLowerCase().includes(search)
  );

  if (!filtered.length) {
    dishesList.innerHTML =
      '<div class="empty">Блюд не найдено</div>';
    return;
  }

  dishesList.innerHTML = "";

  filtered.forEach(dish => {
    const section =
      sections.find(s => s.id === dish.section_id);

    const item = document.createElement("div");
    item.className = "dish";

    const photo = dish.photo_url
      ? `<img class="dish-photo"
          src="${escapeHtml(dish.photo_url)}"
          alt="">`
      : `<div class="dish-photo"></div>`;

    item.innerHTML = `
      ${photo}

      <div class="dish-info">

        <div class="dish-name">
          ${escapeHtml(dish.name)}

          ${
            !dish.is_visible
              ? '<span class="badge">Скрыто</span>'
              : ""
          }
        </div>

        <div class="dish-meta">
          ${escapeHtml(section?.name || "Без раздела")}
          · порядок ${dish.sort_order ?? 0}
        </div>

        <div class="actions">

          <button
            class="btn btn-light btn-small edit-dish"
            data-id="${dish.id}"
          >
            Изменить
          </button>

          <button
            class="btn btn-light btn-small toggle-dish"
            data-id="${dish.id}"
          >
            ${dish.is_visible ? "Скрыть" : "Показать"}
          </button>

          <button
            class="btn btn-danger btn-small delete-dish"
            data-id="${dish.id}"
          >
            Удалить
          </button>

        </div>
      </div>
    `;

    dishesList.appendChild(item);
  });

  document.querySelectorAll(".edit-dish").forEach(btn => {
    btn.addEventListener("click", () => {
      editDish(Number(btn.dataset.id));
    });
  });

  document.querySelectorAll(".toggle-dish").forEach(btn => {
    btn.addEventListener("click", () => {
      toggleDish(Number(btn.dataset.id));
    });
  });

  document.querySelectorAll(".delete-dish").forEach(btn => {
    btn.addEventListener("click", () => {
      deleteDish(Number(btn.dataset.id));
    });
  });
}


/* ---------- РЕДАКТИРОВАНИЕ БЛЮДА ---------- */

function editDish(id) {
  const dish = dishes.find(d => d.id === id);
  if (!dish) return;

  editingDishId = id;
  oldPhotoUrl = dish.photo_url || "";

  dishSection.value = dish.section_id;
  dishName.value = dish.name || "";
  dishDescription.value = dish.short_description || "";
  dishIngredients.value = dish.ingredients || "";
  dishWaiterNote.value = dish.waiter_note || "";
  updateDishPreview();
  dishOrder.value = dish.sort_order ?? 0;
  dishVisible.checked = dish.is_visible;

  if (dish.photo_url) {
    photoPreview.src = dish.photo_url;
    photoPreview.style.display = "block";
      dishPreviewImage.src = dish.photo_url;
  dishPreviewImage.style.display = "block";
  } else {
    photoPreview.removeAttribute("src");
    photoPreview.style.display = "none";
      dishPreviewImage.removeAttribute("src");
  dishPreviewImage.style.display = "none";
  }

  dishFormTitle.textContent = "Редактировать блюдо";
  dishFormCard.classList.remove("hidden");

  dishFormCard.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function resetDishForm() {
  editingDishId = null;
  oldPhotoUrl = "";

  dishName.value = "";
  dishDescription.value = "";
  dishIngredients.value = "";
  dishWaiterNote.value = "";
  dishPhoto.value = "";
  dishOrder.value = "0";
  dishVisible.checked = true;

  photoPreview.removeAttribute("src");
  photoPreview.style.display = "none";

  dishFormTitle.textContent = "Новое блюдо";
  dishMessage.textContent = "";
  updateDishPreview();

dishPreviewImage.removeAttribute("src");
dishPreviewImage.style.display = "none";
}


/* ---------- СКРЫТЬ / ПОКАЗАТЬ ---------- */

async function toggleDish(id) {
  const dish = dishes.find(d => d.id === id);
  if (!dish) return;

  const { error } = await db
    .from("dishes")
    .update({
      is_visible: !dish.is_visible,
      updated_at: new Date().toISOString()
    })
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  await loadDishes();
}


/* ---------- УДАЛЕНИЕ БЛЮДА ---------- */

async function deleteDish(id) {
  const dish = dishes.find(d => d.id === id);
  if (!dish) return;

  if (!confirm(`Удалить блюдо «${dish.name}»?`)) {
    return;
  }

  const { error } = await db
    .from("dishes")
    .delete()
    .eq("id", id);

  if (error) {
    alert(error.message);
    return;
  }

  await loadDishes();
}


/* ---------- БЕЗОПАСНЫЙ ТЕКСТ ---------- */

function escapeHtml(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ---------- СТАРТ ---------- */

checkSession();
</script>
